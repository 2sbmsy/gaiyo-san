[project]
name = "gaiyo-san"
version = "0.1.0"
description = "Gaiyo-san: CLI and GUI tool to generate podcast descriptions from local Whisper transcripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
gui = [
    "streamlit>=1.35.0",
]

[project.scripts]
gaiyo-san = "poddesc.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
